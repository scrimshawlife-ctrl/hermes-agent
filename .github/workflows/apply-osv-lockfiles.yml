name: apply-osv-lockfiles
on:
  push:
    branches: [cursor/osv-dependency-bumps-d22a]
    paths: ['.osv-upload/TRIGGER']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/osv-dependency-bumps-d22a
      - name: Apply staged lockfiles
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, zlib, json, tarfile
          from pathlib import Path
          root = Path('.osv-upload')
          # Apply any *.fixes.json char patches
          for fixp in root.glob('*.fixes.json'):
            target = root / fixp.name.replace('.fixes.json','')
            if not target.exists():
              continue
            data = list(target.read_text())
            for f in json.loads(fixp.read_text()):
              data[int(f['i'])] = f['c']
            target.write_text(''.join(data))
            print('applied fixes', fixp.name)
          if (root/'wa.manifest.json').exists():
            m=json.loads((root/'wa.manifest.json').read_text())
            b64=''.join((root/p).read_text().strip() for p in m['parts'])
            data=zlib.decompress(base64.b64decode(b64))
            Path('scripts/whatsapp-bridge/package-lock.json').write_bytes(data)
            print('wrote whatsapp package-lock', len(data))
          if (root/'manifest.json').exists() and list(root.glob('data.b64.part*')):
            m=json.loads((root/'manifest.json').read_text())
            b64=''.join((root/p).read_text().strip() for p in m['parts'])
            Path('/tmp/locks.tar.gz').write_bytes(base64.b64decode(b64))
            with tarfile.open('/tmp/locks.tar.gz','r:gz') as tar:
              tar.extractall('.')
            print('extracted archive', m.get('files'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json uv.lock scripts/whatsapp-bridge/package-lock.json || true
          if ! git diff --cached --quiet; then
            git commit -m "security: bump OSV-flagged dependencies in lockfiles"
          fi
          git rm -rf .osv-upload .github/workflows/apply-osv-lockfiles.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove OSV upload staging artifacts"
          fi
          git push origin HEAD:cursor/osv-dependency-bumps-d22a
