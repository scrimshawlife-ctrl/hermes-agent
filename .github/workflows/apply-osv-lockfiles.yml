name: apply-osv-lockfiles
on:
  push:
    branches: [cursor/osv-dependency-bumps-d22a]
    paths: ['.osv-upload/TRIGGER']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/osv-dependency-bumps-d22a
      - name: Download and commit OSV lockfile bumps
        env:
          ARCHIVE_URL: https://tmpfiles.org/dl/1789701539.f556dfd6559dd17f/wFwBNeJyBN3H/locks-osv.tar.gz
          ARCHIVE_SHA256: f1eabed836d3890bc57f40638c32a59d73c18883c0472ef04ddffef552767f60
        run: |
          set -euo pipefail
          curl -fsSL "$ARCHIVE_URL" -o /tmp/locks-osv.tar.gz
          echo "$ARCHIVE_SHA256  /tmp/locks-osv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/locks-osv.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json uv.lock scripts/whatsapp-bridge/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: bump OSV-flagged dependencies in lockfiles"
          else
            echo "No lockfile changes"
          fi
          git rm -rf .osv-upload .github/workflows/apply-osv-lockfiles.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove OSV upload staging artifacts"
          fi
          git push origin HEAD:cursor/osv-dependency-bumps-d22a
